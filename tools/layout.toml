# generate เป็น tools/gen/_layout_gen.py (Python) และ firmware/main/layout.h (C)
# ห้ามแก้ไฟล์ที่ generate ออกมา — แก้ที่นี่แล้วรัน `python3 tools/export_layout.py`

[screen]
width = 320
height = 240

[topbar]
# แถบบนเป็นของ *ทุก* หน้า ไม่ใช่ของหน้ามาสคอต — โครงเดียวกับ tools/gen/topbar.py และ
# firmware/main/ct_topbar.c · เวลา โควตา และสถานะลิงก์ต้องหาเจอที่เดิมไม่ว่ากำลังดูหน้าไหน
height = 22
# ไอคอนลิงก์อยู่ขวาสุดของแถบ ของอื่นบนแถบเลื่อนมาซ้ายให้มัน — ตำแหน่งคงที่ ไม่ลอยตาม
# ความยาวนาฬิกา เพราะสิ่งที่ต้องหาเจอโดยไม่ต้องมองคือ "จอนี้ยังคุยกับ Mac อยู่ไหม"
link_icon_w = 11
link_icon_h = 9
link_icon_gap = 6

[slots]
# 3 ตัวคือจำนวนที่ยังให้มาสคอตตัวใหญ่พอมองจากอีกฝั่งห้องได้ (320 / 3 = 106.7)
count = 3
width = 106
# แถบมาสคอตนั่งต่ำ ไม่ชิดแถบบน — ที่ว่างเหนือหัวคือท้องฟ้า ไม่ใช่ที่เหลือ
# 49 ทำให้เส้นฝ่าเท้า (= เส้นขอบฟ้า) ตกที่ y=120 พอดี คือครึ่งจอ
top = 49
# แถบมาสคอตสูงพอดีตัว (67.2px) + baseline_pad ที่แบกป้ายชื่อ + ที่หายใจเหนือหัว 3px
height = 90
# กรอบวาด 23.9 x 16.8 unit -> 4px ต่อ unit = 95.6 x 67.2 px ใน slot 106px
# 4 คือค่าสูงสุดที่ยังวาง 3 ตัวเรียงได้ และ outline 0.34 unit ยังปัดเป็น 1px เท่าเดิม
unit_px = 4
# ระยะจากขอบล่างของ slot ถึงฝ่าเท้ามาสคอต
baseline_pad = 19
# ป้ายชื่อโปรเจกต์แคบกว่า slot เท่านี้ — ที่ว่างซ้ายขวาเพื่อไม่ให้ชื่อของสองตัวชนกัน
# อยู่ที่นี่เพราะมันเป็นตัวกำหนด `Text.Limit.project` ฝั่ง Swift ด้วย (ดู `preview.py --limits`)
# ค่าที่แยกกันเก็บสองฝั่งเคยต่างกันจริง แล้ว preview ก็ตัดชื่อเร็วกว่าบอร์ดโดยไม่มีใครเห็น
label_inset = 4
# ระยะจากเส้นฝ่าเท้าถึงขอบบนของตัวละตินในป้ายชื่อ — 4 = ที่ว่างเหนือละตินของฟอนต์ 12
# (`ct_font_rise`) พอดี ซึ่งวางขอบบนของ *กล่องบรรทัด* ไว้ที่เส้นขอบฟ้าเป๊ะ
#
# ที่ 2 กล่องบรรทัดล้ำขึ้นไปเหนือเส้นขอบฟ้า 2px แล้วชื่อโปรเจกต์ภาษาไทยเอาวรรณยุกต์ไป
# วางบนฟ้ากับกอหญ้า ส่วนชื่อภาษาอังกฤษไม่มีอะไรอยู่ตรงนั้นเลย — แถวป้ายจึงสูงไม่เท่ากัน
# ระหว่างฉาก ทั้งที่เป็นแถวเดียวกัน · ตอนนี้แถวนี้กว้าง 24px คงที่ ตั้งแต่เส้นขอบฟ้า (120)
# ถึง card.top (144) ไม่ว่าจะเป็นภาษาไหนหรือมีฉากอยู่หรือไม่
label_dy = 4

[card]
# เริ่มใต้ป้ายชื่อโปรเจกต์พอดี ไม่ใช่ใต้เส้นขอบฟ้าทันที — 144 = เส้นขอบฟ้า 120 +
# กล่องบรรทัดของป้ายเต็มใบ 24px (ดู slots.label_dy) เลขนี้จึงไม่ใช่ระยะที่เผื่อไว้
# แต่เป็นก้นของแถวป้าย ถ้าดันขึ้นไปอีกสระล่างของชื่อไทยจะจมใต้การ์ดใบแรก
top = 144
# ไม่ถึงก้นจอ — 12px ล่างสุดเป็นของ pip ซึ่งอยู่ทุกหน้ารวมหน้านี้ (ดู `[footer]`)
# ค่านี้ไม่ได้บังคับความสูงของ *การ์ด* (การ์ดเรียงลงมาจาก top ตาม h_one/h_two)
# มันคือความสูงที่แผงโควตากับนาฬิกาใหญ่ใช้จัดกึ่งกลางแนวตั้ง — ทั้งสองอย่างเคยกินถึง
# ขอบล่างพอดี แถบโควตาแถวที่สองจึงไปนั่งทับ pip เป๊ะๆ · 84 = 2*row_h + gap พอดี
# แผงจึงยังเต็มพื้นที่ที่เหลือ ไม่ได้ถูกบีบ แค่ยกขึ้นมาทั้งก้อน
height = 84
pad = 6
# เพดานที่ daemon ส่งมา — บอร์ดยังเลือกได้อีกทีว่าแสดงกี่ใบ (ดู h_one/h_two)
max = 2
# ความสูงการ์ดตามจำนวนบรรทัด ไม่ใช่ค่าเดียวสองแบบ
#
# กล่องบรรทัดที่รับภาษาไทยได้จริงคือ 28px (หัวเรื่อง 14pt) และ 24px (เนื้อ 12pt) —
# วรรณยุกต์ที่ลอยเหนือสระบนกับสระล่างใต้ ญ ฐ กินที่เกินตัวละตินไปคนละหลายพิกเซล
# ค่านี้วัดจากไฟล์ฟอนต์ ไม่ได้เดา (`python3 tools/preview.py --limits`)
#
# ผลคือเลขไม่ลงตัวสำหรับการ์ดสองบรรทัด *สองใบ*: ที่มีจริงคือ 90px (จาก y=150 ถึงก้นจอ)
# ส่วนที่ต้องใช้คือ 56 + 4 + 56 = 116 และดัน top ขึ้นไปอีกไม่ได้เพราะเหนือ 144 คือ
# ป้ายชื่อโปรเจกต์กับเส้นขอบฟ้า · จึงเลือกทางที่ *ไม่* ยอมให้สระตก: การ์ดที่มีสองบรรทัด
# ได้ที่เต็มใบเดียว ที่เหลือไปเป็น "+N more" ซึ่งทำหน้าที่นี้อยู่แล้ว
# (การ์ดบรรทัดเดียวยังได้สองใบเหมือนเดิม — 32 + 4 + 32 = 68 พอดี)
h_one = 32
h_two = 56
gap = 4
# ระยะจากขอบบนการ์ดถึง *ขอบบนของตัวละติน* ในแต่ละบรรทัด ไม่ใช่ขอบบนของกล่องบรรทัด
# (ct_label_set_pos / anchor "t" ถอยที่ว่างของวรรณยุกต์ให้เอง ดู ct_fonts.h)
# 8 = ขอบการ์ด 2 + ที่ว่างเหนือละติน 6 · 34 = 2 + 28 + 4
# การ์ดบรรทัดเดียวใช้ title_dy ตัวเดียวกันโดยไม่ต้องคำนวณกึ่งกลาง เพราะ h_one ถูกเลือก
# ให้กล่องหัวเรื่องพอดีกับขอบบนล่างข้างละ 2 พอดี — หัวเรื่องจึงอยู่ที่เดิมทั้งสองแบบ
title_dy = 8
body_dy = 34
# ที่ที่กันไว้ให้บรรทัด "+N more" ใต้กองการ์ด — ต้องกันไว้ *ก่อน* ตัดสินว่าแสดงกี่ใบ
# ไม่งั้นการ์ดจะกินจนหมดแล้วตัวเลขที่บอกว่ายังเหลืออีกกี่เรื่องก็ไม่มีที่ยืน
more_h = 16
# ข้อความในการ์ดแคบกว่าตัวการ์ดเท่านี้
# (แถบสีซ้าย 3 + ระยะขอบซ้าย 9 + ช่องเครื่องหมายขวา 12 + ขอบขวา 6)
# ตัวกำหนด `Text.Limit.cardTitle/cardBody` ฝั่ง Swift ด้วยเหตุผลเดียวกับ slots.label_inset
# เพิ่มจาก 18 เป็น 30 ตอนเครื่องหมายชนิดการ์ดย้ายมาอยู่ชิดขวา — ถ้าไม่กันที่ไว้
# หัวเรื่องยาวๆ จะลอดไปใต้เครื่องหมาย แล้วสัญญะที่แทนสีก็หายไปตอนที่การ์ดยาวที่สุด
text_inset = 30
# ชนิดของการ์ดต้องอ่านออกเมื่อภาพเป็นขาวดำ — สีอย่างเดียวไม่พอ (8% ของผู้ชายตาบอดสีแดง-เขียว
# และแถบ 3px ที่มุมมอง 60 องศาเหลือ ~1.5px) จึงมีสามแกนที่ไม่ใช่สีเห็นด้วยกันทั้งหมด:
#   ความยาวแถบซ้าย · ความสว่างพื้นการ์ด · รูปทรงเครื่องหมายชิดขวา
# แถบซ้ายกว้างเท่าเดิมทุกชนิด สิ่งที่ต่างคือมันยาวแค่ไหน — วัดจากระยะร่นหัวท้าย
# ไม่ใช่ความยาวตรงๆ เพื่อไม่ให้ความสูงการ์ด (h_one/h_two) กลายเป็นค่าที่เก็บไว้สองที่
rail_w = 3
# ระยะห่างต้องมากพอให้เห็นตอนภาพเป็นขาวดำ: สี alert (L 0.30) กับ good (L 0.33) เทาเท่ากัน
# แถบจึงบอกอะไรไม่ได้เลยด้วยตัวมันเอง ความยาวต้องต่างกันชัด ไม่ใช่ต่างกันนิดเดียว
rail_inset_alert = 0
rail_inset_info = 10
rail_inset_done = 15
# เครื่องหมายชิดขวา กลางแนวตั้ง — ตัน (alert) · กลวง (info) · ขีด (done)
# 8px คือขนาดเล็กสุดที่กลวงกับตันยังแยกออกจากระยะแขน: เจาะรู 4x4 ยังเหลือขอบ 2px ทุกด้าน
mark = 8
mark_stroke = 2
mark_right = 8

[usage]
# แผง utilization กินพื้นที่เดียวกับนาฬิกาใหญ่ — โผล่เมื่อไม่มี card และมีข้อมูลจริง
# สองชั้น: [เลข % + เวลารีเซ็ต + ป้ายหน้าต่าง] แล้วแถบ
# เวลารีเซ็ตอยู่บรรทัดเดียวกับเลข % ไม่ใช่ชั้นที่สาม — ประหยัด 16px ต่อแถว
# โดยไม่ต้องลดขนาดเลข % ซึ่งเป็นสิ่งเดียวที่ต้องอ่านออกจากอีกฝั่งห้อง
row_h = 40
gap = 4
bar_h = 7
# ความยาวหน้าต่างเป็นวินาที — ใช้คำนวณขีด pace (elapsed = window - remaining)
# ค่าคงที่ทั้งคู่ ไม่ได้ส่งมากับ snapshot
session_window = 18000
weekly_window = 604800
# ขั้นสี 3 ระดับ — มากกว่านี้แยกไม่ออกจากระยะโต๊ะ
warn_pct = 60
crit_pct = 85

[stroll]
# ไม่มี session เลย = แถบ slot ว่างทั้งแถบ ซึ่งดูเหมือนอุปกรณ์ค้าง
# แทนที่ด้วยมาสคอตเดินข้ามจอซ้าย -> ขวา แล้ววนใหม่ พร้อมหยุดทำท่าหนึ่งครั้งกลางทาง
#
# ความเร็วเป็นสามขั้นตามโควตาที่อยู่ใต้เส้นขอบฟ้าในจอเดียวกัน (ขั้นเดียวกับ warn_pct/
# crit_pct ของแถบโควตา ไม่ใช่เกณฑ์ชุดที่สอง) — ตัวเลข % อ่านได้ก็ต่อเมื่อหันไปมอง
# ส่วนจังหวะเท้าอ่านได้จากหางตา ซึ่งคือระยะที่จอนี้ถูกใช้จริง · นี่ยังเป็นช่องทางที่ไม่ใช่สี
# ช่องทางเดียวที่ระดับโควตามี (แถบสีอย่างเดียวไม่พอ — ดู PRODUCT.md ▸ Accessibility)
speed_px_s = 34
warn_speed_px_s = 25
crit_speed_px_s = 17
# วินาทีที่หยุดทำท่า — สั้นกว่านี้ดูเหมือนสะดุด ยาวกว่านี้เหมือนค้าง
pause_s = 2.5
# ระยะพ้นขอบจอทั้งสองด้าน (px) — กว้างกว่ามาสคอต (90px) เพื่อให้เข้า/ออกสนิท
pad_px = 96

[sky]
# ฉากกินเต็มจอใต้แถบบน: ฟ้า 22..119 แล้วพื้นดินยาวลงไปถึงก้นจอ
# card วาดพื้นทึบของตัวเองอยู่แล้ว ส่วนแผงโควตา/นาฬิกาใหญ่วางตัวอักษรลงบนพื้นดินตรงๆ
# สีพื้นดินทุกช่วงจึงต้องเข้ม (luminance ~0.04) ไม่ใช่สีหญ้าจริง
# เส้นขอบฟ้า = เส้นฝ่าเท้าพอดี (slots.top + slots.height - slots.baseline_pad)
# เท้าแตะพื้น ไม่ลอย ไม่จม ส่วนป้ายชื่อโปรเจกต์ตกลงไปอยู่บนพื้นดินใต้เท้า
horizon = 120
# ขอบช่วงเวลา (ชั่วโมง) — ที่เหลือคือ night
# กระโดดที่ขอบ ไม่ผสมสี: dawn/dusk สั้นแค่ 2 ชม. จึงทำหน้าที่เป็นขั้นกลางให้เอง
dawn_hour = 5
day_hour = 7
dusk_hour = 17
night_hour = 19
# ดวงอาทิตย์เดินโค้ง 05:00->19:00 ดวงจันทร์ 19:00->05:00 — ตำแหน่งคือเวลาจริง
# ไม่ใช่ของประดับ เหลือบแล้วรู้คร่าวๆ ว่ากี่โมงโดยไม่ต้องอ่านตัวเลข
disc_r = 7
# ความสูงสุดของส่วนโค้งเหนือเส้นขอบฟ้า — 89 ทำให้จุดสูงสุดอยู่ที่ y=31
# และขอบบนของดวง (31-7=24) เหลือช่องว่างเหนือมัน 2px ก่อนถึงแถบบน (สูง 22)
#
# ส่วนโค้งไม่ใช่ sin ล้วนอีกต่อไป — **กลับคำ** · แถบมาสคอตกินย่าน y 53..120 เต็มความ
# กว้างจอ ดวงที่เดินตาม sin ล้วนจึงอยู่เหนือหัวมาสคอตแค่ 10:00-14:00 อีกสิบชั่วโมงที่เหลือ
# ของกลางวันมันเดินอยู่ *หลัง* ตัวละคร แล้วตอนมีสาม session (ซึ่งคือตอนที่จอยุ่งที่สุด)
# ก็อ่านเวลาจากฟ้าไม่ได้พอดี · ตอนนี้ใช้ ease-out บนค่า sin — `s*(2-s)` เมื่อ s = sin(pi*u)
# ซึ่งดันดวงขึ้นเร็วแล้วค้างสูง: พ้นหัวตั้งแต่ 07:49 ถึง 16:11 · x ยังเป็นเส้นตรงตามเวลา
# เหมือนเดิม สิ่งที่แบกข้อมูลเวลาจึงไม่ได้ถูกแตะเลย เปลี่ยนแค่ความสูงที่มันลอยอยู่
# การถูกบังที่ยังเหลือคือตอนดวงเตี้ยจริงๆ (เช้ามาก/เย็นมาก) ซึ่งอ่านเป็นระยะลึก ไม่ใช่ของหาย
#
arc_peak = 89
# ระยะที่ดวงโผล่พ้นขอบจอทั้งสองข้าง — 0 คือขึ้น/ตกที่ขอบจอพอดี
# ลอง 24 แล้วพัง: ดวงอาทิตย์อยู่นอกจอตลอด 05:00-05:55 และ 18:05-19:00
# ซึ่งกินเวลาเกือบครึ่งของช่วง dawn/dusk ทั้งที่นั่นคือช่วงที่ต้องเห็นดวงติดขอบฟ้า
arc_pad = 0
# ตำแหน่งดาว (x, y) พิกเซลสัมบูรณ์ — 4 ดวงแรกกะพริบ ที่เหลือนิ่งตลอด
# กะพริบทุกดวงจะอ่านเป็นสัญญาณเตือน ไม่ใช่ท้องฟ้า
